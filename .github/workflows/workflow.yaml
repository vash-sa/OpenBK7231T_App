name: Build OpenBK LN882H
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: OpenLN882H
            variant: default
            gcc: '10.3-2021.10'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '10.3-2021.10'

      - name: Build Firmware
        run: |
          # Находим, где реально лежит компилятор
          GCC_PATH=$(which arm-none-eabi-gcc)
          GXX_PATH=$(which arm-none-eabi-g++)
          
          # Передаем полные пути в переменные окружения
          export CC=$GCC_PATH
          export CXX=$GXX_PATH
          export ASM=$GCC_PATH
          
          # Запуск сборки с явным указанием путей для CMake
          make OpenLN882H

