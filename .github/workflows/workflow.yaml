name: Build OpenLN882H

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '10.3-2021.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip ninja-build cmake

      - name: Build LN882H Firmware
        run: |
          # В LN882H обычно используется cmake/ninja или специфичный скрипт сборки
          # Для OpenBeken (LN882H) команда обычно выглядит так:
          python3 .github/scripts/build_ln882h.py 
          # Если вы используете стандартный Makefile проекта:
          # make -j$(nproc) PLATFORM=LN882H

      - name: Upload Artifacts
        uses: actions/artifacts-upload@v4
        with:
          name: OpenLN882H_firmware
          path: |
            *.bin
            output/*.bin
