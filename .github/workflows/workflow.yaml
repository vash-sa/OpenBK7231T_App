name: Build OpenBK7231T_App

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  APP_NAME: ${{ github.event.repository.name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refs:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=#define SOFTWARE_VERSION ")([^"]+)' apps/OpenBK7231T_App/src/new_common.h)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build:
    needs: refs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # ОСТАВИЛ ТОЛЬКО ЭТИ ДВЕ
        platform: [ln882h, bl602]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ARM Toolchain
        uses: emmanuel-martinez/install-arm-none-eabi-gcc@v1
        with:
          release: '10.3-2021.10'
      - name: Build
        run: |
          python3 .github/scripts/build.py ${{ matrix.platform }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}_${{ needs.refs.outputs.version }}_${{ matrix.platform }}
          path: |
            output/${{ needs.refs.outputs.version }}/*.bin
          if-no-files-found: warn
