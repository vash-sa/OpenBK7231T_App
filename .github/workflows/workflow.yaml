name: Build App
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  APP_NAME: ${{ github.event.repository.name }}

jobs:
  refs:
    name: Prepare CI Environment
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.refs.outputs.version }}
    steps:
      - name: Source checkout
        uses: actions/checkout@v4
      - name: Set outputs
        id: refs
        run: |
          export BRANCH=${GITHUB_REF#refs/*/}
          export BRANCHTRANSLATED=$(echo ${BRANCH} | tr '/' '_')
          echo "version=${BRANCHTRANSLATED}_$(git rev-parse --short=12 HEAD)" >> $GITHUB_OUTPUT

  build:
    name: Build MCU
    needs: refs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ln882h, bl602]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ARM Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '10.3-2021.10'
      - name: Build
        run: |
          python3 .github/scripts/build.py ${{ matrix.platform }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}_${{ needs.refs.outputs.version }}_${{ matrix.platform }}
          path: |
            output/${{ needs.refs.outputs.version }}/*.bin
          if-no-files-found: warn
