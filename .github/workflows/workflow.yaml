name: Build OpenBK LN882H
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: OpenLN882H
            variant: default
            gcc: '10.3-2021.10'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '10.3-2021.10'

      - name: Build Firmware
        run: |
          # Команда для сборки LN882H (убедитесь, что Makefile на месте)
          make OpenLN882H

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenBK_LN882H_Firmware
          path: |
            sdk/OpenLN882H/build/bin/*.bin
