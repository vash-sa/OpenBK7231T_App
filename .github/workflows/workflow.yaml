name: Build OpenLN882H

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '10.3-2021.10'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install setuptools wheeel

      - name: Build Firmware
        run: |
          # Используем родной скрипт сборки проекта для LN882H
          chmod +x platforms/ln882h/build.sh
          ./platforms/ln882h/build.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenLN882H_Official_Build
          path: |
            platforms/ln882h/sdk/ln882h/out/*.bin
            output/*.bin
