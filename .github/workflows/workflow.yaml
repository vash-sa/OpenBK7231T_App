name: Build OpenLN882H

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '10.3-2021.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip ninja-build cmake

      - name: Build LN882H Firmware
        run: |
          # Замените на вашу команду сборки, если она отличается
          python3 .github/scripts/build_ln882h.py 

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenLN882H_firmware
          path: |
            *.bin
            output/*.bin
