name: Build OpenBK7231T_App

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  APP_NAME: ${{ github.event.repository.name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refs:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=#define SOFTWARE_VERSION ")([^"]+)' apps/OpenBK7231T_App/src/new_common.h)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build:
    needs: refs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ln882h, bl602]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ARM Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '10.3-2021.10'
      - name: Build
        run: |
          if [ "${{ matrix.platform }}" == "bk7231t" ]; then
            python3 .github/scripts/build.py bk7231t
          elif [ "${{ matrix.platform }}" == "bk7231n" ]; then
            python3 .github/scripts/build.py bk7231n
          elif [ "${{ matrix.platform }}" == "bk7231n_small" ]; then
             python3 .github/scripts/build.py bk7231n_small
          elif [ "${{ matrix.platform }}" == "w600" ]; then
            cd platforms/w60x && chmod +x build.sh && ./build.sh
          elif [ "${{ matrix.platform }}" == "w800" ]; then
            cd platforms/w80x && chmod +x build.sh && ./build.sh
          elif [ "${{ matrix.platform }}" == "xr809" ]; then
            cd platforms/xr809 && chmod +x build.sh && ./build.sh
          elif [ "${{ matrix.platform }}" == "bl602" ]; then
            cd platforms/bl602 && chmod +x build.sh && ./build.sh
          elif [ "${{ matrix.platform }}" == "ln882h" ]; then
            cd platforms/ln882h && chmod +x build.sh && ./build.sh
          elif [ "${{ matrix.platform }}" == "esp32" ]; then
            cd platforms/esp32 && chmod +x build.sh && ./build.sh
          elif [ "${{ matrix.platform }}" == "esp32c3" ]; then
            cd platforms/esp32c3 && chmod +x build.sh && ./build.sh
          elif [ "${{ matrix.platform }}" == "esp32s2" ]; then
            cd platforms/esp32s2 && chmod +x build.sh && ./build.sh
          elif [ "${{ matrix.platform }}" == "esp32s3" ]; then
            cd platforms/esp32s3 && chmod +x build.sh && ./build.sh
          fi
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}_${{ needs.refs.outputs.version }}_${{ matrix.platform }}
          path: |
            output/${{ needs.refs.outputs.version }}/*.bin
          if-no-files-found: warn
